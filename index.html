<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pokémon Evolution Advisor</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <header>
      <span class="eyebrow"><span class="pokeball" aria-hidden="true"></span> YOUR EVOLUTION COMPANION</span>
      <h1>Pokémon Evolution Advisor</h1>
      <p>A little comparison. A big next step.</p>
    </header>

    <section class="search-section">
      <div class="search-heading"><span class="step-number" aria-hidden="true">01</span><label for="pokemon-select">Choose your Pokémon</label></div>
      <select id="pokemon-select">
        <option value="">Select a Pokémon</option>
      </select>
    </section>

    <section id="result" class="result" hidden>
      <!-- JavaScript will insert the comparison here -->
    </section>

    <section class="method">
      <h2>How the recommendation works</h2>
      <p>
        The recommendation compares the six base statistics in the supplied
        dataset. It does not consider moves, game-specific requirements, or
        personal preference.
      </p>
    </section>
  </main>
</body>
</html>
